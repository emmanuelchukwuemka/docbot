services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_USER: migratech
      MYSQL_PASSWORD: migratech
      MYSQL_DATABASE: migratech
      MYSQL_ROOT_PASSWORD: migratech_root
    # Deliberately no `ports:` mapping — the `app` service reaches this over Docker's internal
    # network by service name (db:3306), and publishing it to the host exposed MySQL to the
    # public internet with these default credentials (found + fixed 2026-08-29). Note this
    # doesn't route through ufw at all — Docker manipulates iptables directly for published
    # ports, ahead of ufw's own rules, so `ufw deny 3306` alone does nothing; not publishing
    # the port in the first place is the actual fix.
    restart: unless-stopped
    volumes:
      - migratech_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "migratech", "-pmigratech"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://migratech:migratech@db:3306/migratech
      ENVIRONMENT: development
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - migratech_baileys_auth:/app/storage/baileys-auth
      - migratech_documents:/app/storage/documents
    depends_on:
      db:
        condition: service_healthy
    # Baileys prints a QR code to stdout on first run — watch it with:
    #   docker compose logs -f app

volumes:
  migratech_mysqldata:
  migratech_baileys_auth:
  migratech_documents:
